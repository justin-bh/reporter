appId: local.reporter.desktop
productName: reporter
# Without this the Linux/Windows executable is named after the scoped package
# (`@reporter/desktop` → `@reporterdesktop`), which is ugly and breaks the
# `reporter` launch command and the .desktop Icon lookup. Force a clean name.
executableName: reporter
# Pinned so electron-builder can resolve the version under pnpm's hoisted layout.
electronVersion: 33.4.11
npmRebuild: false
# Ad-hoc sign the assembled bundle so it launches on other Apple Silicon Macs
# (electron-builder leaves the signature broken after injecting app.asar).
afterPack: scripts/afterPack.cjs
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Native modules would be unpacked here; reporter-desktop currently uses none.
asarUnpack: []
# Ship the tray icon into the app's resources dir (build/ is not bundled otherwise).
extraResources:
  - from: build/tray.png
    to: tray.png
  - from: build/tray@2x.png
    to: tray@2x.png
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Unsigned local builds; see apps/desktop/README.md for the notarization path.
# Clean filenames everywhere (the package name is scoped: @reporter/desktop).
artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - nsis
linux:
  # Broad, distro-agnostic coverage rather than Debian/Ubuntu only:
  #   - AppImage — runs on most distros (needs FUSE / libfuse2).
  #   - tar.gz   — zero-dependency portable build: extract and run `./reporter`
  #                anywhere (Arch included), no package manager or FUSE required.
  #   - deb      — Debian/Ubuntu.
  # (A native `pacman` target for Arch can be added, but electron-builder needs
  #  bsdtar/libarchive-tools on the runner to emit it; tar.gz already covers Arch.)
  target:
    - AppImage
    - tar.gz
    - deb
  category: Development
  maintainer: reporter <noreply@reporter.local>
deb:
  # Custom postinst that ALWAYS makes chrome-sandbox SUID root. The stock
  # electron-builder postinst only does so when the kernel lacks user namespaces,
  # but it runs as root (who can always create userns), so on Ubuntu 23.10+ it
  # leaves chrome-sandbox non-SUID while the unprivileged user is blocked from
  # userns by AppArmor — Chromium then can't sandbox and aborts on launch.
  afterInstall: build/linux/after-install.sh
  # `depends` REPLACES electron-builder's default list, so it must repeat the
  # standard Electron runtime libs. The capture additions:
  #   - xdg-desktop-portal — the desktop-agnostic Screenshot portal capture.ts
  #     uses first on Wayland (gnome-screenshot lost Shell screenshot access in
  #     GNOME 49 / Ubuntu 25.10+ and no longer works there). The DE ships the
  #     matching backend (…-gnome / …-kde) as part of the desktop.
  #   - gnome-screenshot — still the proven backend on X11, and the CLI fallback.
  # capture.ts also auto-detects spectacle/grim+slurp/maim/scrot/import.
  depends:
    - xdg-desktop-portal
    - gnome-screenshot
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
