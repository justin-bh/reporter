# reporter production stack — one-command deploy on a local server.
#   cp .env.example .env   # set SESSION_SECRET, DB_PASSWORD, ADMIN_*
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reporter
      POSTGRES_USER: reporter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reporter']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    # Publish on host port 80 by default, so the app is reached at http://<host>
    # with no port. Set HTTP_PORT in .env to use a different port (e.g. 8080 if
    # port 80 is already taken). The container always listens on 8080 internally.
    ports:
      - '${HTTP_PORT:-80}:8080'
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://reporter:${DB_PASSWORD}@db:5432/reporter
      BLOB_DIR: /data/blobs
    volumes:
      - blobdata:/data/blobs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: {}
  blobdata: {}
